<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="1000" height="700" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Urganch Davlat Universiteti binosi">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec2ef"/><stop offset=".55" stop-color="#b9dff5"/><stop offset="1" stop-color="#e7f3fb"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf6ea"/><stop offset="1" stop-color="#e6dcc7"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f9e5c"/><stop offset="1" stop-color="#2f7340"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfd6d9"/><stop offset="1" stop-color="#aeb7bb"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="26"/></filter>
  </defs>

  <!-- osmon -->
  <rect width="1000" height="700" fill="url(#sky)"/>
  <g filter="url(#soft)" opacity=".85">
    <ellipse cx="190" cy="120" rx="140" ry="52" fill="#ffffff"/>
    <ellipse cx="700" cy="90" rx="170" ry="46" fill="#ffffff"/>
    <ellipse cx="470" cy="170" rx="120" ry="36" fill="#ffffff" opacity=".7"/>
  </g>
  <circle cx="860" cy="110" r="120" fill="#ffffff" opacity=".22" filter="url(#soft)"/>

  <!-- uzoq daraxtlar -->
  <g opacity=".55" fill="#2f6b45">
    <circle cx="60" cy="430" r="58"/><circle cx="120" cy="445" r="46"/><circle cx="940" cy="435" r="60"/><circle cx="880" cy="450" r="44"/>
  </g>

  <!-- asosiy bino -->
  <g>
    <!-- yon qanotlar -->
    <rect x="120" y="300" width="230" height="180" fill="url(#wall)"/>
    <rect x="650" y="300" width="230" height="180" fill="url(#wall)"/>
    <!-- markaziy blok -->
    <rect x="330" y="250" width="340" height="230" fill="url(#wall)"/>
    <!-- gumbaz / rotonda -->
    <rect x="410" y="180" width="180" height="80" rx="6" fill="#fdf9ef"/>
    <path d="M400 180 h200 l-15-22 H415z" fill="#e8dfca"/>
    <ellipse cx="500" cy="158" rx="86" ry="18" fill="#f3ecdb"/>
    <path d="M500 118 l6 22 h-12z" fill="#c9a227"/>
    <!-- bayroq -->
    <rect x="498" y="86" width="3" height="36" fill="#8a8f96"/>
    <path d="M501 88 h44 v22 h-44z" fill="#0ea5e9"/>
    <path d="M501 95 h44 v8 h-44z" fill="#ffffff"/>
    <path d="M501 101 h44 v9 h-44z" fill="#16a34a"/>
    <!-- tom chizig'i -->
    <rect x="326" y="243" width="348" height="12" rx="3" fill="#d8ceb6"/>
    <rect x="116" y="293" width="238" height="11" rx="3" fill="#d8ceb6"/>
    <rect x="646" y="293" width="238" height="11" rx="3" fill="#d8ceb6"/>
  </g>

  <!-- ustunlar (kolonnalar) -->
  <g fill="#fffdf6">
    <rect x="356" y="300" width="20" height="180" rx="4"/>
    <rect x="404" y="300" width="20" height="180" rx="4"/>
    <rect x="452" y="300" width="20" height="180" rx="4"/>
    <rect x="528" y="300" width="20" height="180" rx="4"/>
    <rect x="576" y="300" width="20" height="180" rx="4"/>
    <rect x="624" y="300" width="20" height="180" rx="4"/>
  </g>
  <!-- markaziy kirish -->
  <path d="M482 480 v-96 a18 18 0 0 1 36 0 v96z" fill="#2b4a55"/>

  <!-- derazalar -->
  <g fill="#3d6b7d" opacity=".9">
    <rect x="150" y="330" width="34" height="52" rx="4"/><rect x="200" y="330" width="34" height="52" rx="4"/>
    <rect x="250" y="330" width="34" height="52" rx="4"/><rect x="300" y="330" width="34" height="52" rx="4"/>
    <rect x="150" y="404" width="34" height="52" rx="4"/><rect x="200" y="404" width="34" height="52" rx="4"/>
    <rect x="250" y="404" width="34" height="52" rx="4"/><rect x="300" y="404" width="34" height="52" rx="4"/>
    <rect x="672" y="330" width="34" height="52" rx="4"/><rect x="722" y="330" width="34" height="52" rx="4"/>
    <rect x="772" y="330" width="34" height="52" rx="4"/><rect x="822" y="330" width="34" height="52" rx="4"/>
    <rect x="672" y="404" width="34" height="52" rx="4"/><rect x="722" y="404" width="34" height="52" rx="4"/>
    <rect x="772" y="404" width="34" height="52" rx="4"/><rect x="822" y="404" width="34" height="52" rx="4"/>
    <rect x="430" y="198" width="24" height="44" rx="12"/><rect x="488" y="198" width="24" height="44" rx="12"/>
    <rect x="546" y="198" width="24" height="44" rx="12"/>
  </g>

  <!-- bino nomi -->
  <text x="500" y="288" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="800" letter-spacing="1.2" fill="#1b4f79">URGANCH DAVLAT UNIVERSITETI</text>

  <!-- monument (obelisk) -->
  <g>
    <rect x="906" y="250" width="26" height="230" fill="#8f9aa3"/>
    <rect x="900" y="240" width="38" height="14" rx="3" fill="#a6b1b9"/>
    <path d="M919 210 l16 32 h-32z" fill="#b8c3ca"/>
    <rect x="890" y="470" width="58" height="18" rx="4" fill="#7f8a93"/>
  </g>

  <!-- yer -->
  <rect y="480" width="1000" height="220" fill="url(#grass)"/>
  <path d="M0 500 h1000 v54 H0z" fill="url(#road)"/>
  <path d="M0 554 C220 590 380 520 560 556 C740 592 880 540 1000 566 L1000 700 L0 700z" fill="#3c8a4e" opacity=".85"/>

  <!-- oldingi daraxtlar -->
  <g>
    <rect x="86" y="430" width="10" height="58" fill="#5a4632"/>
    <circle cx="91" cy="416" r="42" fill="#3f8f52"/><circle cx="64" cy="432" r="30" fill="#357c47"/><circle cx="118" cy="432" r="30" fill="#357c47"/>
    <rect x="836" y="436" width="10" height="52" fill="#5a4632"/>
    <circle cx="841" cy="424" r="38" fill="#3f8f52"/><circle cx="816" cy="440" r="26" fill="#357c47"/><circle cx="866" cy="440" r="26" fill="#357c47"/>
    <rect x="262" y="446" width="8" height="44" fill="#5a4632"/><circle cx="266" cy="436" r="30" fill="#46995a"/>
    <rect x="722" y="448" width="8" height="42" fill="#5a4632"/><circle cx="726" cy="438" r="28" fill="#46995a"/>
  </g>

  <!-- bayroq to'lqini (pastda) -->
  <path d="M0 640 C170 600 300 676 470 646 C640 616 780 668 1000 632 L1000 700 L0 700z" fill="#0ea5e9" opacity=".55"/>
  <path d="M0 656 C170 620 300 692 470 662 C640 634 780 684 1000 650 L1000 700 L0 700z" fill="#ffffff" opacity=".55"/>
  <path d="M0 672 C170 638 300 706 470 678 C640 650 780 698 1000 666 L1000 700 L0 700z" fill="#16a34a" opacity=".6"/>
</svg>
